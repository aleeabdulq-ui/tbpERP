services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: nexus_erp
      MYSQL_USER: erp
      MYSQL_PASSWORD: erp_password
      MYSQL_ROOT_PASSWORD: local_root_password
    ports: ["3306:3306"]
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: mysql://erp:erp_password@mysql:3306/nexus_erp
    ports: ["4000:4000"]
    depends_on:
      mysql: { condition: service_healthy }
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    ports: ["5173:80"]
    depends_on: [api]
volumes: { mysql_data: {} }
